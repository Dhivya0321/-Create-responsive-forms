<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb,#5f27cd);
    background-size:400% 400%;
    animation:gradient 8s ease infinite;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:500px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#5f27cd;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#5f27cd;
}

textarea{
    resize:none;
    height:100px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#ff6b6b,#5f27cd);
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

@media(max-width:600px){
    .container{
        padding:20px;
    }

    h2{
        font-size:22px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h2>Registration Form</h2>

    <form id="myForm">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select id="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea id="address"></textarea>
        </div>

        <button type="submit">Submit</button>

    </form>
</div>

<script>
document.getElementById("myForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    alert("Form Submitted Successfully!");
});
</script>

</body>
</html>
